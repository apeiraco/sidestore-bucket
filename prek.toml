#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "code-quality"
name = "TypeScript type, lint, and format checks"
entry = "mise exec -- pnpm check:code"
language = "system"
files = "^(scripts/.*\\.ts|docs/\\.vitepress/.*\\.mts|package\\.json|tsconfig\\.json|\\.ox.*)$"
pass_filenames = false

[[repos.hooks]]
id = "tests"
name = "Offline tests"
entry = "mise exec -- pnpm test"
language = "system"
files = "^(scripts/|package\\.json|pnpm-lock\\.yaml|tsconfig\\.json)"
pass_filenames = false

[[repos.hooks]]
id = "bucket-consistency"
name = "Bucket and lock consistency"
entry = "mise exec -- pnpm bucket validate"
language = "system"
files = "^(bucket/|bucket\\.lock\\.json$|source\\.json$|scripts/)"
pass_filenames = false

[[repos.hooks]]
id = "generated-artifacts"
name = "Generated source and catalogs"
entry = "mise exec -- pnpm bucket build --check"
language = "system"
files = "^(bucket/|bucket\\.lock\\.json$|source\\.json$|apps\\.json$|docs/(zh/)?apps\\.md$|scripts/)"
pass_filenames = false

[[repos.hooks]]
id = "documentation-links"
name = "Local documentation links"
entry = "mise exec -- lychee --offline --no-progress"
language = "system"
files = "^(README(_CN)?|CONTRIBUTING(_CN)?|CHANGELOG)\\.md$|^docs/(zh/)?apps\\.md$"
types = ["markdown"]
