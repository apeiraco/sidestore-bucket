name: Docs

env:
  MISE_CONFIG_FILE: mise.ci.toml

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - bucket/**
      - scripts/**
      - source.json
      - bucket.lock.json
      - apps.json
      - README.md
      - README_CN.md
      - CONTRIBUTING.md
      - CONTRIBUTING_CN.md
      - LICENSE
      - CHANGELOG.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - mise.toml
      - mise.ci.toml
      - prek.toml
      - justfile
      - .github/workflows/docs.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: jdx/mise-action@v4
      - uses: actions/configure-pages@v6
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Validate source and build docs
        run: |
          mise exec -- just build --check
          mise exec -- just build-docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
